name: Forge Pack Clean Make (Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm sdk:build

      - name: Build renderer (Vite)
        run: pnpm build-only

      - name: Make (Electron Forge)
        run: pnpm make

      - name: Upload artifact (release/make)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Yumuzk-make-${{ runner.os }}-${{ github.ref_name }}
          path: |
            release/make/**

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/make/**

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_HOOK_URL: ${{ secrets.DISCORD_HOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "$DISCORD_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg status "$STATUS" \
              --arg repo "${{ github.repository }}" \
              --arg ref "${{ github.ref_name }}" \
              --arg sha "$(echo '${{ github.sha }}' | cut -c1-7)" \
              --arg actor "${{ github.actor }}" \
              --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '(if $status == "success" then {emoji: "✅", color: 5763719} elif $status == "failure" then {emoji: "❌", color: 15548997} else {emoji: "⚠️", color: 16776960} end) as $sc |
              {
                embeds: [{
                  title: "\($sc.emoji) [\($repo)] Build \($status)",
                  color: $sc.color,
                  fields: [
                    { name: "Branch/Tag", value: "\($ref)", inline: true },
                    { name: "Commit", value: "`\($sha)`", inline: true },
                    { name: "Triggered by", value: "\($actor)", inline: true },
                    { name: "OS", value: "${{ runner.os }}", inline: true }
                  ],
                  url: "\($run_url)"
                }]
              }')"

      - name: Notify Discord (commit message)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B HEAD)
          curl -s -X POST "$DISCORD_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$COMMIT_MSG" '{content: "\($msg)"}')"
        env:
          DISCORD_HOOK_URL: ${{ secrets.DISCORD_HOOK_URL }}