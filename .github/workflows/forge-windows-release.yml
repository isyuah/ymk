name: Forge Pack Clean Make (Windows)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm sdk:build

      - name: Build renderer (Vite)
        run: pnpm build-only

      - name: Make (Electron Forge)
        run: pnpm make

      - name: Upload artifact (release/make)
        uses: actions/upload-artifact@v4
        with:
          name: Yumuzk-make-${{ runner.os }}-${{ github.ref_name }}
          path: |
            release/make/**

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/make/**

      - name: Notify Discord
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="5763719"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
            COLOR="15548997"
          else
            EMOJI="⚠️"
            COLOR="16776960"
          fi
          curl -s -X POST "$DISCORD_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg emoji "$EMOJI" \
              --arg color "$COLOR" \
              --arg status "$STATUS" \
              --arg repo "${{ github.repository }}" \
              --arg ref "${{ github.ref_name }}" \
              --arg sha "$(echo '${{ github.sha }}' | cut -c1-7)" \
              --arg actor "${{ github.actor }}" \
              --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                embeds: [{
                  title: "\($emoji) [\($repo)] Build \($status)",
                  color: ($color | tonumber),
                  fields: [
                    { name: "Branch/Tag", value: "\($ref)", inline: true },
                    { name: "Commit", value: "`\($sha)`", inline: true },
                    { name: "Triggered by", value: "\($actor)", inline: true },
                    { name: "OS", value: "${{ runner.os }}", inline: true }
                  ],
                  url: "\($run_url)"
                }]
              }')"
        env:
          DISCORD_HOOK_URL: ${{ secrets.DISCORD_HOOK_URL }}